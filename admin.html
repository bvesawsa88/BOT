<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>แอดมิน — Battle of Talingchan</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@500;600;700&family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=20260820ab">
<style>
  html,body{overflow:auto;height:auto;min-height:100%;-webkit-user-select:text;user-select:text}
  .ad{max-width:560px;margin:0 auto;padding:22px 16px 48px}
  .ad-card{background:rgba(255,250,240,.5);border:2px solid var(--ink);border-radius:16px;padding:18px 18px 16px;color:var(--ink)}
  .ad h1{font-family:'IBM Plex Sans Thai',sans-serif;font-size:22px;margin:0 0 6px}
  .ad-sub{font-size:13px;margin:0 0 16px;opacity:.8}
  .ad label{display:block;font-family:'IBM Plex Sans Thai',sans-serif;font-size:13px;font-weight:600;margin:12px 0 4px}
  .ad input[type=text],.ad input[type=password],.ad textarea{
    width:100%;padding:10px 12px;border:1.5px solid var(--ink);border-radius:8px;
    background:rgba(255,252,245,.85);color:var(--ink);font-family:'Sarabun',sans-serif;font-size:14px
  }
  .ad textarea{min-height:72px;resize:vertical}
  .ad-row{display:flex;align-items:center;gap:8px;margin:12px 0}
  .ad-row input{width:auto}
  .ad-slots{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}
  .ad-slot{border:1.5px solid var(--ink);border-radius:10px;padding:8px;background:rgba(255,252,245,.7);cursor:pointer;text-align:center}
  .ad-slot img{width:100%;height:88px;object-fit:cover;border-radius:6px;background:#1a1612;display:block}
  .ad-slot.mat img{height:56px}
  .ad-slot span{display:block;font-size:12px;font-weight:600;margin-top:6px}
  .ad-msg{min-height:18px;font-size:13px;color:#7a3b12;margin:8px 0}
  .ad-msg.ok{color:#215c38}
  .ad-actions{display:flex;gap:8px;margin-top:14px}
  .ad-actions>button,.ad-actions>a{flex:1;text-align:center;text-decoration:none}
  .ad-foot{margin-top:18px;padding-top:12px;border-top:1px solid rgba(26,22,18,.2)}
</style>
</head>
<body>
<div class="ad">
  <div id="loginCard" class="ad-card">
    <h1>ตั้งค่าเว็บ</h1>
    <p class="ad-sub">เข้าสู่ระบบด้วยบัญชีแอดมิน</p>
    <label for="loginUser">ชื่อผู้ใช้</label>
    <input id="loginUser" autocomplete="username" maxlength="20">
    <label for="loginPass">รหัสผ่าน</label>
    <input id="loginPass" type="password" autocomplete="current-password" maxlength="64">
    <div id="loginMsg" class="ad-msg"></div>
    <div class="ad-actions">
      <a class="btn-dark" href="/">กลับเกม</a>
      <button type="button" id="btnDoLogin" class="btn-primary">เข้าสู่ระบบ</button>
    </div>
  </div>

  <div id="panelCard" class="ad-card hidden">
    <h1>ตั้งค่าเว็บ</h1>
    <p class="ad-sub">สปอนเซอร์ / ประกาศ / พร้อมเพย์ — บันทึกแล้วใช้ทันที ไม่ต้องแก้โค้ด</p>

    <label class="ad-row"><input type="checkbox" id="sponsorOn"> บอทใช้สกินสปอนเซอร์</label>
    <label for="spName">ชื่อสปอนเซอร์ (สั้น)</label>
    <input id="spName" maxlength="24" placeholder="เช่น TINNY">
    <label for="spLabel">คำอธิบาย</label>
    <input id="spLabel" maxlength="60" placeholder="เช่น สปอน · TINNY Cafe">
    <label>รูปสกิน (แตะเพื่อเปลี่ยน)</label>
    <div class="ad-slots">
      <div class="ad-slot" data-slot="cardBack"><img alt=""><span>หลังการ์ด</span></div>
      <div class="ad-slot" data-slot="lifeBack"><img alt=""><span>หลังไลฟ์</span></div>
      <div class="ad-slot mat" data-slot="playmat"><img alt=""><span>เพลย์แมท</span></div>
      <div class="ad-slot mat" data-slot="playmatOpp"><img alt=""><span>เพลย์แมทฝั่งตรงข้าม</span></div>
    </div>
    <input id="filePick" type="file" accept="image/png,image/jpeg,image/webp" hidden>

    <label for="notice">ประกาศบนเมนูหลัก (เว้นว่าง = ไม่โชว์)</label>
    <textarea id="notice" maxlength="200" placeholder="เช่น สปอนเดือนนี้ TINNY Cafe"></textarea>
    <label for="promptpay">พร้อมเพย์ (เว้นว่าง = ใช้ค่าเดิมในหน้าเว็บ)</label>
    <input id="promptpay" inputmode="numeric" maxlength="15" placeholder="เช่น 0812345678">
    <label for="truemoney">ลิงก์ TrueMoney (เว้นว่าง = ใช้ค่าเดิม)</label>
    <input id="truemoney" maxlength="200" placeholder="https://…">

    <div id="saveMsg" class="ad-msg"></div>
    <div class="ad-actions">
      <a class="btn-dark" href="/">กลับเกม</a>
      <button type="button" id="btnSave" class="btn-primary">บันทึก</button>
    </div>

    <div class="ad-foot">
      <label>เปลี่ยนรหัสแอดมิน</label>
      <input id="pwCur" type="password" placeholder="รหัสปัจจุบัน" maxlength="64" autocomplete="current-password">
      <input id="pwNext" type="password" placeholder="รหัสใหม่ (อย่างน้อย 6 ตัว)" maxlength="64" autocomplete="new-password" style="margin-top:8px">
      <div id="pwMsg" class="ad-msg"></div>
      <button type="button" id="btnPw" class="btn-dark">เปลี่ยนรหัส</button>
    </div>
  </div>
</div>
<script>
(function () {
  const TOKEN_KEY = 'bot_auth_token';
  const token = () => { try { return localStorage.getItem(TOKEN_KEY) || ''; } catch (e) { return ''; } };
  const setToken = (t) => { try { localStorage.setItem(TOKEN_KEY, t); } catch (e) { } };
  const byId = (id) => document.getElementById(id);
  let settings = null;
  let pickSlot = '';

  function msg(id, t, ok) {
    const el = byId(id);
    el.textContent = t || '';
    el.classList.toggle('ok', !!ok);
  }
  function authHeaders(json) {
    const h = { Authorization: 'Bearer ' + token() };
    if (json) h['Content-Type'] = 'application/json';
    return h;
  }
  function showLogin(on) {
    byId('loginCard').classList.toggle('hidden', !on);
    byId('panelCard').classList.toggle('hidden', on);
  }
  function fill() {
    const s = settings || {};
    const sp = s.sponsor || {};
    byId('sponsorOn').checked = s.sponsorEnabled !== false;
    byId('spName').value = sp.name || '';
    byId('spLabel').value = sp.label || '';
    byId('notice').value = s.notice || '';
    byId('promptpay').value = s.promptpay || '';
    byId('truemoney').value = s.truemoney || '';
    document.querySelectorAll('.ad-slot').forEach((el) => {
      const slot = el.getAttribute('data-slot');
      const img = el.querySelector('img');
      const src = sp[slot] || '';
      img.src = src ? src + (src.indexOf('?') >= 0 ? '&' : '?') + 'v=' + Date.now() : '';
    });
  }
  async function loadPanel() {
    const r = await fetch('/admin/settings', { headers: authHeaders() });
    const j = await r.json();
    if (!j.ok) throw new Error(j.error || 'ไม่ใช่แอดมิน');
    settings = j.settings;
    fill();
    showLogin(false);
  }
  async function boot() {
    const t = token();
    if (!t) { showLogin(true); return; }
    try {
      const r = await fetch('/auth/me', { headers: authHeaders() });
      const j = await r.json();
      if (!j.ok || !j.admin) { showLogin(true); msg('loginMsg', 'บัญชีนี้ไม่ใช่แอดมิน'); return; }
      await loadPanel();
    } catch (e) { showLogin(true); }
  }
  async function doLogin() {
    msg('loginMsg', '');
    const username = byId('loginUser').value.trim();
    const password = byId('loginPass').value;
    if (!username || !password) { msg('loginMsg', 'กรอกชื่อและรหัสผ่าน'); return; }
    try {
      const r = await fetch('/auth/login', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password })
      });
      const j = await r.json();
      if (!j.ok) { msg('loginMsg', j.error || 'ไม่สำเร็จ'); return; }
      if (!j.admin) { msg('loginMsg', 'บัญชีนี้ไม่ใช่แอดมิน'); return; }
      setToken(j.token);
      await loadPanel();
    } catch (e) { msg('loginMsg', 'เชื่อมต่อไม่ได้'); }
  }
  async function save() {
    msg('saveMsg', 'กำลังบันทึก…');
    const body = {
      sponsorEnabled: byId('sponsorOn').checked,
      notice: byId('notice').value,
      promptpay: byId('promptpay').value,
      truemoney: byId('truemoney').value,
      sponsor: Object.assign({}, (settings && settings.sponsor) || {}, {
        name: byId('spName').value,
        label: byId('spLabel').value
      })
    };
    try {
      const r = await fetch('/admin/settings', {
        method: 'PUT', headers: authHeaders(true), body: JSON.stringify(body)
      });
      const j = await r.json();
      if (!j.ok) { msg('saveMsg', j.error || 'ไม่สำเร็จ'); return; }
      settings = j.settings;
      fill();
      msg('saveMsg', 'บันทึกแล้ว — คนที่รีเฟรชหน้าเกมจะเห็นค่าใหม่', true);
    } catch (e) { msg('saveMsg', 'เชื่อมต่อไม่ได้'); }
  }
  async function upload(slot, file) {
    msg('saveMsg', 'กำลังอัปโหลดรูป…');
    const data = await new Promise((resolve, reject) => {
      const fr = new FileReader();
      fr.onload = () => {
        const s = String(fr.result || '');
        const i = s.indexOf(',');
        resolve(i >= 0 ? s.slice(i + 1) : s);
      };
      fr.onerror = () => reject(new Error('อ่านไฟล์ไม่ได้'));
      fr.readAsDataURL(file);
    });
    const r = await fetch('/admin/upload', {
      method: 'POST', headers: authHeaders(true),
      body: JSON.stringify({ slot, data })
    });
    const j = await r.json();
    if (!j.ok) { msg('saveMsg', j.error || 'อัปโหลดไม่สำเร็จ'); return; }
    settings = j.settings;
    fill();
    msg('saveMsg', 'อัปโหลดรูปแล้ว — กดบันทึกถ้าแก้ชื่อ/ประกาศด้วย', true);
  }
  async function changePw() {
    msg('pwMsg', '');
    const password = byId('pwCur').value;
    const next = byId('pwNext').value;
    if (!password || !next) { msg('pwMsg', 'กรอกรหัสปัจจุบันและรหัสใหม่'); return; }
    try {
      const r = await fetch('/admin/password', {
        method: 'PUT', headers: authHeaders(true),
        body: JSON.stringify({ password, next })
      });
      const j = await r.json();
      if (!j.ok) { msg('pwMsg', j.error || 'ไม่สำเร็จ'); return; }
      if (j.token) setToken(j.token);
      byId('pwCur').value = '';
      byId('pwNext').value = '';
      msg('pwMsg', 'เปลี่ยนรหัสแล้ว', true);
    } catch (e) { msg('pwMsg', 'เชื่อมต่อไม่ได้'); }
  }

  byId('btnDoLogin').onclick = doLogin;
  byId('loginPass').addEventListener('keydown', (e) => { if (e.key === 'Enter') doLogin(); });
  byId('btnSave').onclick = save;
  byId('btnPw').onclick = changePw;
  byId('filePick').onchange = () => {
    const f = byId('filePick').files && byId('filePick').files[0];
    const slot = pickSlot;
    pickSlot = '';
    byId('filePick').value = '';
    if (f && slot) upload(slot, f).catch((err) => msg('saveMsg', err.message || 'อัปโหลดไม่สำเร็จ'));
  };
  document.querySelectorAll('.ad-slot').forEach((el) => {
    el.onclick = () => {
      pickSlot = el.getAttribute('data-slot');
      byId('filePick').click();
    };
  });
  boot();
})();
</script>
</body>
</html>
